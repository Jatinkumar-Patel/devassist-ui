<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevAssist</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // GitHub Pages SPA fallback: rewrite /?/route back to a clean route before React boots.
      (function (location) {
        if (location.search[1] === '/') {
          var decoded = location.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&'); })
            .join('?');
          window.history.replaceState(null, '', location.pathname.slice(0, -1) + decoded + location.hash);
          return;
        }

        // Daily cache-bust on GitHub Pages so users get latest deployed index/assets
        // without manual Ctrl+F5.
        if (/\.github\.io$/i.test(location.hostname)) {
          var d = new Date();
          var stamp = d.getUTCFullYear().toString() +
            String(d.getUTCMonth() + 1).padStart(2, '0') +
            String(d.getUTCDate()).padStart(2, '0');

          var params = new URLSearchParams(location.search);
          if (params.get('v') !== stamp) {
            params.set('v', stamp);
            var next = location.pathname + '?' + params.toString() + location.hash;
            location.replace(next);
          }
        }
      })(window.location);
    </script>

  </body>

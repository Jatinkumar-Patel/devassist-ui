name: Deploy SPA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install root workspace deps; bridge deps are not needed for SPA build
      - run: npm install --workspaces=false
        working-directory: .

      - name: Install SPA deps
        run: npm install
        working-directory: packages/spa

      # Copy product registry into SPA public folder before build
      - run: mkdir -p public/config && cp ../../config/product-registry.json public/config/product-registry.json
        working-directory: packages/spa
        shell: bash

      - name: Build SPA
        run: npm run build
        working-directory: packages/spa

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/spa/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

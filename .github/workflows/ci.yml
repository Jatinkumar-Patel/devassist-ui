name: CI — Typecheck & Build

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck bridge
        working-directory: packages/bridge
        run: npx tsc --noEmit
      - name: Typecheck + build SPA
        working-directory: packages/spa
        run: npm run build
